apiVersion: apps/v1
kind: Deployment
metadata:
  name: trading-portal
  labels:
    app: trading-portal
spec:
  replicas: 3
  selector:
    matchLabels:
      app: trading-portal
  template:
    metadata:
      labels:
        app: trading-portal
    spec:
      containers:
      - name: trading-portal
        image: trading-portal:latest
        ports:
        - containerPort: 8000
          name: http
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /api/health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /api/health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: trading-portal
  labels:
    app: trading-portal
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 8000
    protocol: TCP
    name: http
  selector:
    app: trading-portal
